name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Compile contracts
        run: npm run compile
      - name: Run smart contract tests
        run: npm run test:contracts
      - name: Run web and edge shared tests
        run: npm test -w web
      - name: Typecheck and build web app
        run: npm run build -w web
